{% extends "master.html" %}

{% block title %}Editar Producto - Conexia{% endblock %}

{% block content %}
<div class="auth-container">
  <h2 class="auth-title">Editar Producto</h2>
  <p class="auth-subtitle">
    Modifica la información del producto.
  </p>

  <form action="" method="post">
    {% csrf_token %}
    {{ formulario.as_p }}
    
    <div class="form-actions">
      <button type="submit" class="btn">Guardar Cambios</button>
      <a href="{% url 'index' %}" class="btn btn-secondary" style="text-align: center; text-decoration: none;">Cancelar / Volver</a>
    </div>
  </form>
</div>
{% endblock %}
